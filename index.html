<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RBCs • Transportation Visualizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0b0a0b;
      --card:#141214;
      --card-2:#1b181b;
      --ink:#f5f2f3;
      --muted:#a69b9f;
      --border:#2c2427;
      --primary:#cf092b;
      --primary-2:#96061f;
      --primary-light:#ff4d6a;
      --accent:rgba(207, 9, 43, .13);
      --success:#10291f;
      --success-border:#1f7a53;
      --success-text:#4ade80;
      --current:#2c210e;
      --current-stroke:#f59e0b;
      --ghost:#221b1e;
      --shadow:0 20px 48px rgba(0, 0, 0, .55);
      --radius:24px;
    }
    *{box-sizing:border-box}
    html,body{margin:0}
    body{
      font-family:"Cairo", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 12% 10%, rgba(207,9,43,.16) 0, transparent 34%),
        radial-gradient(circle at 88% 16%, rgba(207,9,43,.11) 0, transparent 28%),
        radial-gradient(circle at 18% 86%, rgba(150,6,31,.12) 0, transparent 36%),
        var(--bg);
      color:var(--ink);
      min-height:100vh;
    }
    .shell{max-width:1320px;margin:auto;padding:24px 16px 36px}
    .hero{
      background:linear-gradient(135deg, #161113 0%, #3a0812 52%, #cf092b 100%);
      color:#fff;
      border-radius:30px;
      padding:24px 28px;
      position:relative;
      overflow:hidden;
      border:1px solid rgba(207,9,43,.38);
      box-shadow:0 22px 50px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.08);
      margin-bottom:24px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
      flex-wrap:wrap;
    }
    .hero::before,.hero::after{
      content:"";position:absolute;border-radius:50%;pointer-events:none;
      background:rgba(255,255,255,.05);
    }
    .hero::before{width:240px;height:240px;left:-60px;top:-80px;box-shadow:0 0 0 28px rgba(255,255,255,.03), 0 0 0 60px rgba(255,255,255,.02)}
    .hero::after{width:180px;height:180px;right:-40px;bottom:-60px;box-shadow:0 0 0 22px rgba(255,255,255,.03), 0 0 0 48px rgba(255,255,255,.02)}
    .brand{display:flex;align-items:center;gap:18px;flex-wrap:wrap;position:relative;z-index:1}
    .logo-badge{
      width:84px;height:84px;border-radius:22px;background:#ffffff;
      display:flex;align-items:center;justify-content:center;
      box-shadow:0 10px 28px rgba(0,0,0,.35);
      padding:6px;flex-shrink:0;overflow:hidden;
    }
    .logo-badge img{width:100%;height:100%;object-fit:contain;display:block}
    .hero-eyebrow{
      display:inline-block;
      background:rgba(207,9,43,.28);
      padding:4px 13px;
      border-radius:999px;
      font-size:12px;
      font-weight:700;
      letter-spacing:.3px;
      border:1px solid rgba(255,255,255,.2);
      color:#ffe6ea;
    }
    .hero h1{margin:8px 0 4px;font-size:clamp(26px,4vw,40px);line-height:1.2;position:relative;z-index:1}
    .hero p{margin:0;color:rgba(255,240,242,.88);font-size:clamp(14px,2vw,16px);font-weight:600;position:relative;z-index:1}
    .hero-mascot{
      position:relative;z-index:1;
      display:flex;align-items:center;justify-content:center;
      padding-left:6px;
    }
    .hero-mascot img{
      height:122px;width:auto;display:block;
      filter:drop-shadow(0 12px 20px rgba(0,0,0,.45));
      animation:mascotFloat 4s ease-in-out infinite;
    }
    @keyframes mascotFloat{
      0%,100%{transform:translateY(0)}
      50%{transform:translateY(-6px)}
    }
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
    .panel{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:26px;
      box-shadow:var(--shadow);
      overflow:hidden;
    }
    .panel-head{
      padding:20px 22px 16px;
      background:linear-gradient(180deg, #1b1618 0%, #141214 100%);
      border-bottom:1px solid var(--border);
      border-top:4px solid var(--primary);
    }
    .eyebrow{font-size:12px;font-weight:800;letter-spacing:.4px;color:var(--primary-light);text-transform:uppercase}
    .panel-title{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:4px}
    .panel-title h2{margin:0;font-size:clamp(19px,3vw,24px);line-height:1.25;color:var(--ink)}
    .pill{background:rgba(207,9,43,.18);border:1px solid rgba(207,9,43,.4);padding:6px 14px;border-radius:999px;font-size:13px;font-weight:800;color:#ff8095}
    .stage{padding:18px 18px 16px}
    .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
    .stat{
      border:1px solid var(--border);
      border-radius:16px;padding:12px 12px 10px;background:var(--card-2);
    }
    .stat small{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;font-weight:600}
    .stat strong{display:block;font-size:18px;line-height:1.1;color:var(--ink)}
    .progress-wrap{margin:12px 0 16px}
    .progress-label{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);font-weight:700;margin-bottom:7px}
    progress{width:100%;height:10px;border:none;border-radius:999px;overflow:hidden;background:#261f22}
    progress::-webkit-progress-bar{background:#261f22;border-radius:999px}
    progress::-webkit-progress-value{background:linear-gradient(90deg,var(--primary-2),var(--primary),var(--primary-light));border-radius:999px}
    progress::-moz-progress-bar{background:linear-gradient(90deg,var(--primary-2),var(--primary),var(--primary-light));border-radius:999px}
    .table-wrap{overflow:auto;border-radius:20px;border:1px solid var(--border);background:#0f0d0f}
    table{width:100%;min-width:560px;border-collapse:separate;border-spacing:6px;text-align:center;direction:ltr;table-layout:fixed;padding:10px}
    th{font-size:13px;color:var(--muted);font-weight:800}
    th.rowhead{min-width:54px}
    td,th.cellbox{height:82px;background:var(--card-2);border-radius:16px;position:relative}
    td{
      border:2px solid transparent;
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);
    }
    td small{position:absolute;left:9px;top:7px;font-size:11px;color:#a09398;font-weight:700;font-family:Arial, sans-serif}
    td strong{font-size:28px;font-weight:800;color:var(--success-text);font-family:Arial, sans-serif}
    td .dash{font-size:18px;color:#4a3f43}
    td.done{background:linear-gradient(180deg,#122d22,#0d2119);border-color:var(--success-border)}
    td.current{background:linear-gradient(180deg,#332510,#241a0b);border-color:var(--current-stroke);box-shadow:0 0 0 4px rgba(245,158,11,.18)}
    td.zero{background:linear-gradient(180deg,#261d21,#1d1619);border-style:dashed;border-color:#785a64}
    td.zero strong{color:#ff758c}
    .remaining{height:54px;background:rgba(207,9,43,.16);color:#ff758c;font-size:20px;font-weight:800;box-shadow:inset 0 0 0 1px rgba(207,9,43,.32)}
    .legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
    .tag{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;background:var(--card-2);border:1px solid var(--border);border-radius:999px;font-size:12px;color:var(--muted);font-weight:600}
    .dot{width:14px;height:14px;border-radius:5px;border:1px solid rgba(255,255,255,.15)}
    .controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
    button{
      appearance:none;border:none;border-radius:14px;padding:12px 16px;font:inherit;font-weight:800;cursor:pointer;
      transition:transform .15s ease, box-shadow .15s ease, background .15s ease, border-color .15s ease;
    }
    button:hover:not(:disabled){transform:translateY(-1px)}
    button:disabled{opacity:.38;cursor:default;transform:none}
    .btn-primary{background:linear-gradient(135deg,var(--primary-2),var(--primary));color:#fff;box-shadow:0 8px 22px rgba(207,9,43,.35);flex:1 1 180px}
    .btn-primary:hover:not(:disabled){box-shadow:0 10px 26px rgba(207,9,43,.5)}
    .btn-soft{background:var(--card-2);border:1px solid var(--border);color:var(--ink);flex:1 1 120px}
    .btn-soft:hover:not(:disabled){border-color:var(--primary);color:#ff758c}
    .step-explanation{margin-top:14px;padding:13px 16px;border:1px solid rgba(207,9,43,.28);border-right:4px solid var(--primary);border-radius:14px;background:rgba(207,9,43,.09);font-size:13px;line-height:1.85;min-height:102px;color:#f1eaec}
    .step-explanation b{display:block;color:#ff6b84;font-size:12px;margin-bottom:4px}
    .step-explanation .formula{display:block;direction:ltr;text-align:right;font-family:Arial,sans-serif;font-weight:700;color:#ffb3c0;margin-top:4px}
    .footer-note{padding:0 18px 18px;font-size:12px;color:var(--muted);font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:10px}
    .footer-brand{display:inline-flex;align-items:center;gap:8px}
    .footer-brand img{width:22px;height:22px;border-radius:6px;background:#fff;padding:2px;object-fit:contain}
    .footer-note span{color:var(--primary-light)}
    .chip-bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .chip{padding:6px 12px;border-radius:999px;background:var(--card-2);border:1px solid var(--border);font-size:12px;font-weight:700;color:var(--ink)}
    .page-footer{
      margin-top:26px;
      padding:16px 22px;
      border-radius:20px;
      background:var(--card);
      border:1px solid var(--border);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      flex-wrap:wrap;
      font-size:13px;
      color:var(--muted);
    }
    .page-footer-right{display:flex;align-items:center;gap:12px}
    .page-footer-right img{width:34px;height:34px;border-radius:9px;background:#fff;padding:3px;object-fit:contain}
    .page-footer strong{color:var(--ink)}
    .page-footer .red{color:var(--primary-light);font-weight:800}
    @media (max-width:980px){.grid{grid-template-columns:1fr}.shell{padding:16px 12px 26px}}
    @media (max-width:640px){
      .hero{padding:20px 16px;border-radius:24px;justify-content:center;text-align:center}
      .brand{justify-content:center}
      .logo-badge{width:70px;height:70px;border-radius:18px}
      .hero-mascot img{height:98px}
      .panel{border-radius:22px}
      .panel-head{padding:16px 14px 12px}
      .stage{padding:14px 12px 12px}
      .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
      table{min-width:520px;padding:8px}
      td,th.cellbox{height:72px;border-radius:14px}
      td strong{font-size:24px}
      .remaining{font-size:18px;height:48px}
      .controls{gap:6px}
      button{padding:11px 12px;border-radius:13px;font-size:14px}
      .page-footer{justify-content:center;text-align:center}
    }
  </style>
</head>

    const dataset = {
      title: 'مثال المصانع ومراكز التوزيع',
      costs: [
        [2,3,11,7],
        [1,0,6,1],
        [5,8,15,9]
      ],
      supply: [6,1,10],
      demand: [7,5,3,2]
    };

    const methods = [
      {
        key: 'northwest',
        english: 'Northwest Corner',
        title: 'الركن الشمالي الغربي',
        steps: [
          {r:0,c:0,alloc:6,cost:2},
          {r:1,c:0,alloc:1,cost:1},
          {r:2,c:1,alloc:5,cost:8},
          {r:2,c:2,alloc:3,cost:15},
          {r:2,c:3,alloc:2,cost:9}
        ],
        extraZero: {r:1,c:1,label:'0*'},
        finalCost: 11600
      },
      {
        key: 'leastcost',
        english: 'Least Cost Method',
        title: 'التكلفة الدنيا',
        steps: [
          {r:1,c:1,alloc:1,cost:0},
          {r:0,c:0,alloc:6,cost:2},
          {r:2,c:0,alloc:1,cost:5},
          {r:2,c:1,alloc:4,cost:8},
          {r:2,c:3,alloc:2,cost:9},
          {r:2,c:2,alloc:3,cost:15}
        ],
        extraZero: null,
        finalCost: 11200
      }
    ];

    const states = {};

    function money(n){return n.toLocaleString('en-US') + ' $'}
    function cellName(r,c){return `X${r+1}${c+1}`}
    function buildPanel(method){
      return `
        <article class="panel" id="panel-${method.key}">
          <div class="panel-head">
            <div class="eyebrow">${method.english}</div>
            <div class="panel-title">
              <h2>${method.title}</h2>
              <div class="pill" id="step-pill-${method.key}"></div>
            </div>
            <div class="chip-bar">
              <span class="chip">${dataset.title}</span>
              <span class="chip" id="cost-chip-${method.key}"></span>
            </div>
          </div>
          <div class="stage">
            <div class="stats">
              <div class="stat"><small>الخلية الحالية</small><strong id="cell-${method.key}">—</strong></div>
              <div class="stat"><small>التخصيص</small><strong id="alloc-${method.key}">—</strong></div>
              <div class="stat"><small>التكلفة/وحدة</small><strong id="unitcost-${method.key}">—</strong></div>
              <div class="stat"><small>التكلفة حتى الآن</small><strong id="running-${method.key}">0 $</strong></div>
            </div>

            <div class="progress-wrap">
              <div class="progress-label">
                <span>التقدم</span>
                <span id="progress-label-${method.key}"></span>
              </div>
              <progress id="progress-${method.key}" max="${method.steps.length}" value="0"></progress>
            </div>

            <div class="table-wrap">
              <table id="table-${method.key}"></table>
            </div>

            <div class="legend">
              <span class="tag"><i class="dot" style="background:var(--success);border-color:var(--success-border)"></i>تخصيص</span>
              <span class="tag"><i class="dot" style="background:var(--current);border-color:var(--current-stroke)"></i>الخطوة الحالية</span>
              ${method.extraZero ? '<span class="tag"><i class="dot" style="background:var(--ghost);border-color:#785a64"></i>0*</span>' : ''}
            </div>

            <div class="step-explanation" id="explain-${method.key}" aria-live="polite"></div>
            <div class="controls">
              <button class="btn-primary" id="next-${method.key}">الخطوة التالية</button>
              <button class="btn-soft" id="prev-${method.key}">السابق</button>
              <button class="btn-soft" id="reset-${method.key}">إعادة</button>
            </div>
          </div>
          <div class="footer-note">
            <div class="footer-brand"><img src="${LOGO_SRC}" alt="RBCs"><div><span>RBCs</span> • Visual Learning Aid</div></div>
            <div>Operations Research Team</div>
          </div>
        </article>`;
    }

    function init(){
      const app = document.getElementById('app');
      app.innerHTML = methods.map(buildPanel).join('');
      methods.forEach(method => {
        states[method.key] = {index:0};
        document.getElementById(`next-${method.key}`).addEventListener('click', ()=>changeStep(method.key, 1));
        document.getElementById(`prev-${method.key}`).addEventListener('click', ()=>changeStep(method.key, -1));
        document.getElementById(`reset-${method.key}`).addEventListener('click', ()=>resetStep(method.key));
        render(method.key);
      });
    }

    function changeStep(key, delta){
      const method = methods.find(m=>m.key===key);
      const state = states[key];
      const max = method.steps.length;
      state.index = Math.max(0, Math.min(max, state.index + delta));
      render(key);
    }

    function resetStep(key){
      states[key].index = 0;
      render(key);
    }

    function computeRunning(method, upto){
      let cost = 0;
      for(let i=0;i<upto;i++){
        const s = method.steps[i];
        cost += s.alloc * s.cost;
      }
      return cost * 100;
    }

    function render(key){
      const method = methods.find(m=>m.key===key);
      const state = states[key];
      const index = state.index;
      const table = document.getElementById(`table-${key}`);
      const current = index < method.steps.length ? method.steps[index] : null;
      const committed = method.steps.slice(0, index);

      const remainingSupply = [...dataset.supply];
      const remainingDemand = [...dataset.demand];
      committed.forEach(step => {
        remainingSupply[step.r] -= step.alloc;
        remainingDemand[step.c] -= step.alloc;
      });

      let html = '<tr><th></th>' + dataset.costs[0].map((_,i)=>`<th>C${i+1}</th>`).join('') + '<th>العرض</th></tr>';

      dataset.costs.forEach((row,r) => {
        html += `<tr><th class="rowhead">P${r+1}</th>`;
        row.forEach((cost,c) => {
          const done = committed.find(s=>s.r===r && s.c===c);
          const isCurrent = current && current.r===r && current.c===c;
          const isZero = method.extraZero && index === method.steps.length && method.extraZero.r===r && method.extraZero.c===c;
          let cls = '';
          if(done) cls='done'; else if(isCurrent) cls='current'; else if(isZero) cls='zero';
          let content = '<span class="dash">–</span>';
          if(done) content = `<strong>${done.alloc}</strong>`;
          if(isZero) content = `<strong>${method.extraZero.label}</strong>`;
          html += `<td class="${cls}"><small>${cost}</small>${content}</td>`;
        });
        html += `<td class="remaining">${remainingSupply[r]}</td></tr>`;
      });

      html += '<tr><th class="rowhead">الطلب</th>' + remainingDemand.map(v=>`<td class="remaining">${v}</td>`).join('') + `<td class="remaining">${remainingSupply.reduce((a,b)=>a+b,0)}</td></tr>`;
      table.innerHTML = html;

      const stepText = index < method.steps.length ? `الخطوة ${index+1} / ${method.steps.length}` : 'اكتمل';
      document.getElementById(`step-pill-${key}`).textContent = stepText;
      document.getElementById(`progress-label-${key}`).textContent = `${index} / ${method.steps.length}`;
      document.getElementById(`progress-${key}`).value = index;
      document.getElementById(`cost-chip-${key}`).textContent = index === method.steps.length ? money(method.finalCost) : '—';

      if(current){
        document.getElementById(`cell-${key}`).textContent = cellName(current.r,current.c);
        document.getElementById(`alloc-${key}`).textContent = current.alloc;
        document.getElementById(`unitcost-${key}`).textContent = current.cost;
      } else if(index === method.steps.length) {
        document.getElementById(`cell-${key}`).textContent = method.extraZero ? '0*' : '—';
        document.getElementById(`alloc-${key}`).textContent = method.extraZero ? method.extraZero.label : 'تم';
        document.getElementById(`unitcost-${key}`).textContent = '—';
      } else {
        document.getElementById(`cell-${key}`).textContent = '—';
        document.getElementById(`alloc-${key}`).textContent = '—';
        document.getElementById(`unitcost-${key}`).textContent = '—';
      }

      const notes = {
        northwest: [
          'نبدأ من الخلية العلوية اليسرى (1,1) دون النظر إلى التكلفة.',
          'نفد عرض المصنع الأول، وبقيت وحدة واحدة من طلب المركز الأول؛ ننتقل للأسفل.',
          'نفد عرض المصنع الثاني وتحقق طلب المركز الأول معاً؛ ننتقل قطرياً إلى (3,2).',
          'تحقق طلب المركز الثاني وبقيت 5 وحدات من عرض المصنع الثالث؛ ننتقل يميناً.',
          'تحقق طلب المركز الثالث وبقيت وحدتان من عرض المصنع الثالث؛ ننتقل يميناً.',
          'اكتمل التوزيع بخمسة تخصيصات موجبة فقط. الحل معتل؛ اخترنا X₂₂ = 0 أساسياً لإكمال الأساس إلى 6 متغيرات.'
        ],
        leastcost: [
          'نختار الخلية (2,2) لأن تكلفتها صفر، وهي الأقل في الجدول.',
          'نفد عرض المصنع الثاني؛ أقل تكلفة متاحة الآن هي 2 في الخلية (1,1).',
          'نفد عرض المصنع الأول؛ نختار أقل تكلفة متبقية، وهي 5 في الخلية (3,1).',
          'تحقق طلب المركز الأول؛ نختار التكلفة التالية 8 في الخلية (3,2).',
          'تحقق طلب المركز الثاني؛ نختار المركز الرابع لأن تكلفته 9 أقل من 15.',
          'تحقق طلب المركز الرابع؛ بقيت 3 وحدات للمركز الثالث، وهو الوجهة المتبقية.',
          'اكتمل التوزيع بستة تخصيصات موجبة؛ الحل الأساسي غير معتل.'
        ]
      };
      const formula = current ? `<span class="formula">X<sub>${current.r+1}${current.c+1}</sub> = min(${remainingSupply[current.r]}, ${remainingDemand[current.c]}) = ${current.alloc}</span>` : '<span>هذه تكلفة حل ابتدائي، وليست بالضرورة التكلفة المثلى.</span>';
      document.getElementById(`explain-${key}`).innerHTML = `<b>${current?'لماذا هذه الخلية؟':'نتيجة الحل'}</b>${notes[key][index]}${formula}`;
      document.getElementById(`running-${key}`).textContent = money(computeRunning(method,index));

      document.getElementById(`prev-${key}`).disabled = index === 0;
      document.getElementById(`next-${key}`).disabled = index === method.steps.length;
    }

    init();
  </script>
</body>
</html>
